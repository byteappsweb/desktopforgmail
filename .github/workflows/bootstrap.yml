name: Bootstrap website source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import the website source
        run: |
          curl -L --fail https://desktopforgmail.pages.dev/source.zip -o /tmp/source.zip
          unzip -o /tmp/source.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Desktop for Gmail marketing site" || exit 0
          git push
